<div style="display: flex; flex-direction: row; align-items: center; gap: 10px">
  <div style="display: flex; flex-direction: row; gap: 5px; align-items: center;">
    @if (node.children?.length) {
      <i class="material-icons" (click)="updateToggle()">arrow_right</i>
    }
    <div [ngStyle]="isMatchingSearch() ? {'background-color': 'lightblue'} : {}" style="padding: 2px;">{{ node.name }}</div>
    <i class="material-icons">{{ node.icon }}</i>
  </div>
  <div>
    <i class="material-icons" style="color: slategrey; cursor: pointer;" (click)="removeNode()">disabled_by_default</i>
    @if (!node.season_id) {
      <i class="material-icons" style="color: cadetblue; cursor: pointer;" (click)="addNode()">add_circle</i>
    }
  </div>
</div>

@if (node.children?.length && showChildren()) {
  <div style="margin-left: 40px;">
    @for (node of node.children; track node.id) {
      <app-movie-tree-node [node]="node" [searchText]="searchText"></app-movie-tree-node>
    }
  </div>
}

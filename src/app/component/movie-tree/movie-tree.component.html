<input #searchInput placeholder="Search movie..." (input)="updateSearchText(searchInput.value)"/>

<div class="movie-grid-root">
  @for (node of appStore.nodeTree(); track node.id) {
    <app-movie-tree-node 
      [node]="node" 
      [searchText]="searchText">
    </app-movie-tree-node>
  }
</div>

<input id="search-input"
       #searchInput
       placeholder="Search movie..."
       (input)="updateSearchText(searchInput.value)"/>

<div class="movie-grid-root">
  @for (node of appStore.nodeTree(); track node.id) {
    <app-movie-tree-node
      [node]="node"
      [searchText]="searchText"
      (dialogData)="setDialogData($event)"/>
  }
</div>

@if (showDialog()) {
  <app-dialog [data]="dialogData"
              (closed)="updateShowDialog()"/>
}

<div>
  @if (node.children?.length) {
    <i class="material-icons" (click)="showChildrenToggle()">arrow_right</i>
  }
  {{ node.name }}
  <i class="material-icons">{{ node.icon }}</i>
  <i class="material-icons" style="color: slategrey; cursor: pointer;" (click)="removeNode()">disabled_by_default</i>
  @if (!node.season_id) {
    <i class="material-icons" style="color: cadetblue; cursor: pointer;" (click)="addNode()">add_circle</i>
  }
</div>

@if (node.children?.length && showChildren()) {
  <div style="margin-left: 40px;">
    @for (node of node.children; track node.id) {
      <app-movie-tree-node [node]="node"></app-movie-tree-node>
    }
  </div>
}
